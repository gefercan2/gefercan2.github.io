<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venice · Rome — Renaissance Network</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>

/* ══════════════════════════════════════
   GLOBAL
   ══════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #045678, #141427);  /* ← BACKGROUND GRADIENT */
  color: white;
}

/* ══════════════════════════════════════
   FULL-SCREEN NETWORK CANVAS
   ══════════════════════════════════════ */
#netWrapper { position: absolute; inset: 0; cursor: grab; overflow: hidden; }
#netWrapper.panning { cursor: grabbing; }
#networkSvg { width: 100%; height: 100%; display: block; }

/* Title badge, top-centre */
.dash-title {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  font-size: 15px; font-weight: bold; color: #66ccff;
  background: rgba(0,0,0,0.55); padding: 6px 20px; border-radius: 20px;
  border: 1px solid rgba(102,204,255,0.3);
  pointer-events: none; z-index: 200;
}

/* Zoom buttons, bottom-right */
.zoom-controls { position: fixed; bottom: 22px; right: 22px; display: flex; gap: 8px; z-index: 200; }
.zoom-btn {
  background: rgba(102,204,255,0.15); border: 1px solid rgba(102,204,255,0.45);
  color: #66ccff; padding: 9px 16px; border-radius: 7px; cursor: pointer;
  font-weight: bold; font-size: 14px; transition: background 0.2s;
}
.zoom-btn:hover { background: rgba(102,204,255,0.32); }

/* ══════════════════════════════════════
   SHARED DRAGGABLE / COLLAPSIBLE PANEL
   (used by legend, timeline, info panel, tools panel)
   ══════════════════════════════════════ */
.panel {
  position: fixed;
  background: rgba(8,10,26,0.90);         /* ← PANEL BACKGROUND */
  border: 1px solid rgba(102,204,255,0.28);
  border-radius: 22px;
  z-index: 300;
  box-shadow: 0 8px 32px rgba(0,0,0,0.55);
  width: 250px;                            /* ← DEFAULT PANEL WIDTH */
}
.panel-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 22px; cursor: move; user-select: none;
  border-bottom: 1px solid rgba(102,204,255,0.18);
}
.panel-title { font-size:1em; font-weight: lighter; color: #66ccff; }
.panel-actions { display: flex; gap: 6px; align-items: center; }
.panel-btn {
  background: rgba(102,204,255,0.15); border: 1px solid rgba(102,204,255,0.4);
  color: #66ccff; width: 20px; height: 20px; border-radius: 5px; cursor: pointer;
  font-size: 12px; display: flex; align-items: center; justify-content: center; line-height: 1;
}
.panel-btn:hover { background: rgba(102,204,255,0.32); }
.panel-body { padding: 22px; }

/* Legend */
.legend-item { display: flex; align-items: center; margin-bottom: 7px; gap: 8px; font-size: 11px; }
.legend-item:last-child { margin-bottom: 0; }
.legend-diamond {
  width:14px; height:14px; background:#ff4444;          /* ← sync with CONFIG.node.artistColor */
  transform: rotate(45deg); border: 1.5px solid white; flex-shrink:0;
}
.legend-octagon {
  width:16px; height:16px; background:#4466ff;          /* ← sync with CONFIG.node.cityColor */
  clip-path: polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  flex-shrink:0;
}
.legend-pop {
  width:16px; height:16px; border-radius:50%;
  background: rgba(255,200,80,0.35); border: 1.5px solid rgba(255,190,60,0.7); flex-shrink:0;
}

/* Panel positions */
#legendPanel   { top: 70px; left: 18px; }
#timelinePanel { top: 70px; right: 22px; }
#infoPanel     { top: 350px; left: 18px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#infoPanel.visible { opacity: 1; pointer-events: auto; }
#toolsPanel    { top: 70px; left: 260px; width: 300px; }

/* Info panel content */
.info-circle {
  width: 180px; height: 180px; border-radius: 50%;
  border: 3px solid rgba(102,204,255,0.85); overflow: hidden;
  margin: 0 auto 10px; background: #1a1a2e;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: bold; color: #66ccff;}
.info-circle img { width: 100%; height: 100%; object-fit: cover; }
.info-name { font-size: 1em; font-weight: bold; color: #66ccff; margin-bottom: 6px; text-align: center; }
.info-meta { font-size: 11px; color: rgba(255,255,255,0.76); line-height: 1.6; margin-bottom: 10px; text-align: center; }
.info-link {
  font-size: 11px; color: #66ccff; text-decoration: none;
  background: rgba(102,204,255,0.12); border: 1px solid rgba(102,204,255,0.28);
  padding: 5px 10px; border-radius: 5px; display: block; text-align: center;}
.info-link:hover { background: rgba(102,204,255,0.28); }

/* ══════════════════════════════════════
   TOOLS PANEL — Search & Compare tabs
   ══════════════════════════════════════ */
.tool-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tool-tab-btn {
  flex: 1; background: rgba(102,204,255,0.08); border: 1px solid rgba(102,204,255,0.28);
  color: rgba(255,255,255,0.65); padding: 6px 8px; border-radius: 6px; cursor: pointer;
  font-size: 11px; font-weight: bold; transition: background 0.2s, color 0.2s;
}
.tool-tab-btn:hover { background: rgba(102,204,255,0.18); }
.tool-tab-btn.active { background: rgba(102,204,255,0.30); color: #66ccff; border-color: rgba(102,204,255,0.55); }

.tool-tab-content { display: none; }
.tool-tab-content.active { display: block; }

/* Search tab */
#searchInput {
  width: 100%; padding: 7px 9px; border-radius: 6px;
  border: 1px solid rgba(102,204,255,0.32); background: rgba(255,255,255,0.05);
  color: white; font-size: 12px; outline: none;
}
#searchInput::placeholder { color: rgba(255,255,255,0.35); }
#searchInput:focus { border-color: rgba(102,204,255,0.65); background: rgba(255,255,255,0.08); }

.search-results { margin-top: 6px; max-height: 190px; overflow-y: auto; }
.search-result-item {
  padding: 6px 8px; font-size: 11.5px; border-radius: 5px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; transition: background 0.15s;
}
.search-result-item:hover { background: rgba(102,204,255,0.16); }
.search-result-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.search-result-type { margin-left: auto; font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.03em; }
.search-empty { font-size: 11px; color: rgba(255,255,255,0.4); padding: 6px 2px; }

/* Compare tab */
.compare-select {
  width: 100%; padding: 7px 9px; margin-bottom: 8px; border-radius: 6px;
  border: 1px solid rgba(102,204,255,0.32); background: rgba(20,22,42,0.9);
  color: white; font-size: 11.5px; outline: none;
}
.compare-select:focus { border-color: rgba(102,204,255,0.65); }
.compare-grid { display: flex; gap: 8px; margin-top: 12px; }
.compare-col { flex: 1; min-width: 0; text-align: center; }
.compare-col .info-circle { width: 54px; height: 54px; font-size: 18px; margin-bottom: 6px; border-width: 2px; }
.compare-col .info-name { font-size: 10.5px; margin-bottom: 4px; }
.compare-col .info-meta { font-size: 9px; line-height: 1.45; margin-bottom: 0; }
.compare-empty { font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: 16px; }

/* Timeline SVG elements */
.timeline-axis { stroke: rgba(255,255,255,0.55); stroke-width: 2; }
.timeline-tick { stroke: rgba(255,255,255,0.35); stroke-width: 1; }
.tl-year-lbl   { fill: rgba(255,255,255,0.65); font-size: 9px; }
.timeline-node { cursor: pointer; stroke: white; stroke-width: 1.5; transition: opacity 0.3s; }
.timeline-arc  { fill:none; stroke:#ff4444; stroke-width:2.5; opacity:0; transition:opacity 0.3s; } /* ← ARC COLOR */
.tl-node-lbl   { fill: white; font-size: 8.5px; pointer-events:none; font-weight:bold; transition:opacity 0.3s; }

/* Network SVG elements */
.network-node { cursor:pointer; stroke:white; stroke-width:2; transition:opacity 0.3s; }
.network-link { fill:none; stroke:rgba(255,255,255,0.32); stroke-width:2; transition:opacity 0.3s; }
.node-label   { fill:white; font-size:11px; text-anchor:middle; pointer-events:none; font-weight:bold; transition:opacity 0.3s; }

/* Circular containment boundary guide (visual only, not a clip) */
.containment-guide { fill:none; stroke: rgba(102,204,255,0.15); stroke-width: 1.5; stroke-dasharray: 6 6; }

</style>
</head>
<body>

<div class="dash-title">  RENAISSANCE NETWORK</div>
<div class="zoom-controls">
  <button class="zoom-btn" id="zoomIn">＋</button>
  <button class="zoom-btn" id="zoomOut">－</button>
</div>

<div id="netWrapper"><svg id="networkSvg"></svg></div>

<!-- LEGEND PANEL — draggable + collapsible -->
<div class="panel" id="legendPanel">
  <div class="panel-header" id="legendHeader">
    <span class="panel-title">Legend</span>
    <div class="panel-actions"><button class="panel-btn" id="legendToggle">−</button></div>
  </div>
  <div class="panel-body" id="legendBody">
    <div class="legend-item"><div class="legend-diamond"></div><span>Artist</span></div>
    <div class="legend-item"><div class="legend-octagon"></div><span>City</span></div>
    <div class="legend-item"><div class="legend-pop"></div><span>Population</span></div><br>
  </div>
</div>

<!-- TOOLS PANEL — Search & Compare, draggable + collapsible -->
<div class="panel" id="toolsPanel">
  <div class="panel-header" id="toolsHeader">
    <span class="panel-title">Search &amp; Compare</span>
    <div class="panel-actions"><button class="panel-btn" id="toolsToggle">−</button></div>
  </div>
  <div class="panel-body" id="toolsBody">
    <div class="tool-tabs">
      <button class="tool-tab-btn active" id="tabSearchBtn">Search</button>
      <button class="tool-tab-btn" id="tabCompareBtn">Compare</button>
    </div>

    <div class="tool-tab-content active" id="tabSearch">
      <input type="text" id="searchInput" placeholder="Search artist or city…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="tool-tab-content" id="tabCompare">
      <select class="compare-select" id="compareSelect1"><option value="">Select artist / city 1…</option></select>
      <select class="compare-select" id="compareSelect2"><option value="">Select artist / city 2…</option></select>
      <select class="compare-select" id="compareSelect3"><option value="">Select artist / city 3…</option></select>
      <div id="compareResults"><div class="compare-empty">Pick up to three to compare</div></div><br>
    </div>
  </div><br>
</div>

<!-- TIMELINE PANEL — draggable + collapsible -->
<div class="panel" id="timelinePanel">
  <div class="panel-header" id="timelineHeader">
    <span class="panel-title">Timeline 1400–1600</span>
    <div class="panel-actions"><button class="panel-btn" id="timelineToggle">−</button></div>
  </div>
  <div class="panel-body" id="timelineBody"><svg id="timelineSvg"></svg></div>
</div>

<!-- INFO PANEL — draggable, replaces the old tooltip -->
<div class="panel" id="infoPanel">
  <div class="panel-header" id="infoHeader">
    <span class="panel-title">Selected node</span>
    <div class="panel-actions"><button class="panel-btn" id="infoClose">×</button></div>
  </div>
  <div class="panel-body">
    <div class="info-circle" id="infoCircle"></div>
    <div class="info-name" id="infoName"></div>
    <div class="info-meta" id="infoMeta"></div>
    <a class="info-link" id="infoLink" href="#" target="_blank" rel="noopener">More info ↗</a>
  </div>
</div>

/* ═══════════════════════════════════════════════════════════════
   INFO PANEL (replaces the old tooltip)
   ═══════════════════════════════════════════════════════════════ */
const infoPanel  = document.getElementById('infoPanel');
const infoCircle = document.getElementById('infoCircle');
const infoName   = document.getElementById('infoName');
const infoMeta   = document.getElementById('infoMeta');
const infoLink   = document.getElementById('infoLink');

function populateInfoPanel(d) {
  // fall back to a lettered placeholder if the node has no image
  infoCircle.innerHTML = d.image
    ? `<img src="${d.image}" alt="${d.name}">`
    : d.name.charAt(0);
  infoName.textContent = d.name;
  const deathTxt = d.death ? ' · ' + d.death : '';
  infoMeta.innerHTML = `${d.type} · ${d.birth}${deathTxt}<br><em>${d["main discipline"] || ''}</em>`;
  infoLink.href = d.link || '#';
  infoPanel.classList.add('visible');
}

document.getElementById('infoClose').addEventListener('click', e => {
  e.stopPropagation();
  infoPanel.classList.remove('visible');
});


/* ═══════════════════════════════════════════════════════════════
   NODE SHAPES
   ═══════════════════════════════════════════════════════════════ */
function nodePath(d) {
  if (d.type === 'artist') {
    const s = CONFIG.node.artistSize;
    return `M 0,-${s} L ${s},0 L 0,${s} L -${s},0 Z`;
  }
  const s = CONFIG.node.citySize, a = Math.PI / 4;
  let p = 'M ';
  for (let i = 0; i < 8; i++) {
    p += (i ? 'L ' : '') + (s * Math.cos(i * a)).toFixed(2) + ',' + (s * Math.sin(i * a)).toFixed(2) + ' ';
  }
  return p + 'Z';
}


/* ═══════════════════════════════════════════════════════════════
   SELECTION LOGIC
   ═══════════════════════════════════════════════════════════════ */
function getConnected(name) {
  const s = new Set([name]);
  LINKS_DATA.forEach(l => {
    const src = typeof l.source === 'object' ? l.source.name : l.source;
    const tgt = typeof l.target === 'object' ? l.target.name : l.target;
    if (src === name) s.add(tgt);
    if (tgt === name) s.add(src);
  });
  return s;
}

function selectNode(name, d) {
  const conn = getConnected(name);
  const { selectedOpacity: sO, deselectedOpacity: dO, linkDeselectedOpacity: lO } = CONFIG.effects;
  const { selectedOpacity: tsO, deselectedOpacity: tdO } = CONFIG.timelineEffects;

  d3.selectAll('.network-node').style('opacity', n => conn.has(n.name) ? sO : dO);
  d3.selectAll('.node-label')
    .style('opacity', n => conn.has(n.name) ? sO : dO)
    .style('font-size', n => n.name === name
      ? CONFIG.node.selectedLabelFontSize + 'px'
      : CONFIG.node.labelFontSize + 'px');

  d3.selectAll('.network-link').style('opacity', l => {
    const ls = typeof l.source === 'object' ? l.source.name : l.source;
    const lt = typeof l.target === 'object' ? l.target.name : l.target;
    return (ls === name || lt === name) ? sO : lO;
  });

  d3.selectAll('.timeline-node').style('opacity', n => n.name === name ? tsO : tdO);
  d3.selectAll('.tl-node-lbl')
    .style('opacity', n => n.name === name ? tsO : tdO)
    .style('font-size', n => n.name === name
      ? CONFIG.timeline.selectedLabelFontSize + 'px'
      : CONFIG.timeline.labelFontSize + 'px');
  d3.selectAll('.timeline-arc').style('opacity', n => n.name === name ? 1 : 0);

  if (d) populateInfoPanel(d);
}

/* Clicking empty space resets highlighting (info panel stays until × is clicked) */
document.addEventListener('click', e => {
  if (!e.target.closest('.network-node') && !e.target.closest('.timeline-node') && !e.target.closest('.panel')) {
    const { selectedOpacity: sO } = CONFIG.effects;
    const { deselectedOpacity: tdO } = CONFIG.timelineEffects;

    d3.selectAll('.network-node,.node-label').style('opacity', sO);
    d3.selectAll('.node-label').style('font-size', CONFIG.node.labelFontSize + 'px');

    d3.selectAll('.network-link').style('opacity', sO);

    d3.selectAll('.timeline-node,.tl-node-lbl').style('opacity', tdO);
    d3.selectAll('.tl-node-lbl').style('font-size', CONFIG.timeline.labelFontSize + 'px');

    d3.selectAll('.timeline-arc').style('opacity', 0);
  }
});


/* ═══════════════════════════════════════════════════════════════
   ZOOM & PAN
   ═══════════════════════════════════════════════════════════════ */
function applyTransform(animate) {
  if (!networkGroup) return;
  const cx = netW / 2, cy = netH / 2;
  const t = `translate(${cx},${cy}) translate(${panX},${panY}) scale(${zoomLevel}) translate(-${cx},-${cy})`;
  if (animate) networkGroup.transition().duration(240).attr('transform', t);
  else         networkGroup.attr('transform', t);
}

document.getElementById('zoomIn').addEventListener('click', () => {
  zoomLevel = Math.min(CONFIG.zoom.max, zoomLevel + CONFIG.zoom.step);
  applyTransform(true);
});
document.getElementById('zoomOut').addEventListener('click', () => {
  zoomLevel = Math.max(CONFIG.zoom.min, zoomLevel - CONFIG.zoom.step);
  applyTransform(true);
});

const wrapper = document.getElementById('netWrapper');
wrapper.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('.zoom-btn') || e.target.closest('.network-node')) return;
  isPanning = true; panSX = e.clientX; panSY = e.clientY;
  wrapper.classList.add('panning');
});
document.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX += e.clientX - panSX; panY += e.clientY - panSY;
  panSX = e.clientX; panSY = e.clientY;
  applyTransform(false);
});
document.addEventListener('mouseup', () => { isPanning = false; wrapper.classList.remove('panning'); });


/* ═══════════════════════════════════════════════════════════════
   S-CURVE LINK PATH
   Builds a cubic Bezier where the two control points are pushed
   perpendicular to the source→target line in opposite directions,
   producing an extended, flattened "S" shape instead of a simple arc.
   ═══════════════════════════════════════════════════════════════ */
function sPath(sx, sy, tx, ty) {
  const dx = tx - sx, dy = ty - sy;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const px = -dy / dist, py = dx / dist;   // unit perpendicular vector
  const off = CONFIG.links.sCurveOffset;
  const c1x = sx + dx * 0.33 + px * off, c1y = sy + dy * 0.33 + py * off;
  const c2x = sx + dx * 0.67 - px * off, c2y = sy + dy * 0.67 - py * off;
  return `M${sx},${sy} C${c1x},${c1y} ${c2x},${c2y} ${tx},${ty}`;
}


/* ═══════════════════════════════════════════════════════════════
   CIRCULAR CONTAINMENT FORCE
   Custom D3 force run every simulation tick. Clamps any node that
   drifts past CONFIG.containment.diameter/2 back onto the circle's
   edge and damps its velocity. Positions only — nothing is clipped.
   ═══════════════════════════════════════════════════════════════ */
function containmentForce() {
  const cx = netW / 2, cy = netH / 2, maxR = CONFIG.containment.diameter / 2;
  NODES_DATA.forEach(n => {
    const dx = n.x - cx, dy = n.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxR) {
      const angle = Math.atan2(dy, dx);
      n.x = cx + Math.cos(angle) * maxR;
      n.y = cy + Math.sin(angle) * maxR;
      n.vx *= 0.3; n.vy *= 0.3;
    }
  });
}


/* ═══════════════════════════════════════════════════════════════
   NETWORK GRAPH
   ═══════════════════════════════════════════════════════════════ */
function initNetwork() {
  netW = window.innerWidth;
  netH = window.innerHeight;
  const svg = d3.select('#networkSvg').attr('width', netW).attr('height', netH);
  networkGroup = svg.append('g');

  if (CONFIG.containment.showGuide) {
    networkGroup.append('circle').attr('class', 'containment-guide')
      .attr('cx', netW / 2).attr('cy', netH / 2).attr('r', CONFIG.containment.diameter / 2);
  }

  const bgLayer = networkGroup.append('g');
  const popScale = d3.scaleSqrt().domain([0, 30000]).range([0, CONFIG.bubbles.maxRadius]);

  const cityBubbles = bgLayer.selectAll('.city-bubble')
    .data(CITIES_DATA).join('circle').attr('class', 'city-bubble')
    .attr('fill', CONFIG.bubbles.fillColor)
    .attr('stroke', CONFIG.bubbles.strokeColor)
    .attr('stroke-width', CONFIG.bubbles.strokeWidth);

  const cityPopLabels = bgLayer.selectAll('.city-pop-lbl')
    .data(CITIES_DATA).join('text').attr('class', 'city-pop-lbl')
    .attr('text-anchor', 'middle')
    .attr('fill', CONFIG.bubbles.labelColor)
    .attr('font-size', CONFIG.bubbles.labelFontSize)
    .attr('pointer-events', 'none')
    .text(d => `pop. ${d.population.toLocaleString()}`);

  simulation = d3.forceSimulation(NODES_DATA)
    .force('link',        d3.forceLink(LINKS_DATA).id(d => d.name).distance(CONFIG.force.linkDistance))
    .force('charge',      d3.forceManyBody().strength(CONFIG.force.chargeStrength))
    .force('center',      d3.forceCenter(netW / 2, netH / 2).strength(CONFIG.force.centerStrength))
    .force('collide',     d3.forceCollide(CONFIG.force.collideRadius))
    .force('containment', containmentForce)
    .alphaDecay(CONFIG.force.alphaDecay);

  const { centerNode, centerXRatio, centerYRatio, nodeOffsets, softPinStrength } = CONFIG.positioning;
  NODES_DATA.forEach(n => {
    if (n.name === centerNode) {
      n.fx = netW * centerXRatio; n.fy = netH * centerYRatio;
    } else if (nodeOffsets[n.name]) {
      n.targetX = netW * centerXRatio + nodeOffsets[n.name].dx;
      n.targetY = netH * centerYRatio + nodeOffsets[n.name].dy;
    }
  });

  const links = networkGroup.append('g')
    .selectAll('path').data(LINKS_DATA).join('path')
    .attr('class', 'network-link')
    .attr('stroke', CONFIG.links.stroke)
    .attr('stroke-width', CONFIG.links.strokeWidth);

  const nodes = networkGroup.append('g')
    .selectAll('path').data(NODES_DATA).join('path')
    .attr('class', 'network-node')
    .attr('fill', d => d.type === 'artist' ? CONFIG.node.artistColor : CONFIG.node.cityColor)
    .attr('stroke', CONFIG.node.strokeColor)
    .attr('stroke-width', CONFIG.node.strokeWidth)
    .attr('d', nodePath)
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => {
        if (!e.active) simulation.alphaTarget(0);
        if (d.name !== centerNode) { d.fx = null; d.fy = null; }
      }))
    .on('click', (e, d) => { e.stopPropagation(); selectNode(d.name, d); });

  const labels = networkGroup.append('g')
    .selectAll('text').data(NODES_DATA).join('text')
    .attr('class', 'node-label')
    .attr('font-size', CONFIG.node.labelFontSize)
    .attr('dy', CONFIG.node.labelOffset)
    .text(d => d.name);

  simulation.on('tick', () => {
    NODES_DATA.forEach(n => {
      if (n.targetX !== undefined) {
        n.vx += (n.targetX - n.x) * softPinStrength * 0.09;
        n.vy += (n.targetY - n.y) * softPinStrength * 0.09;
      }
    });

    links.attr('d', l => sPath(l.source.x, l.source.y, l.target.x, l.target.y));

    nodes.attr('transform', d => `translate(${d.x},${d.y})`);
    labels.attr('transform', d => `translate(${d.x},${d.y})`);

    cityBubbles
      .attr('cx', d => { const n = NODES_DATA.find(n => n.name === d.name); return n ? n.x : 0; })
      .attr('cy', d => { const n = NODES_DATA.find(n => n.name === d.name); return n ? n.y : 0; })
      .attr('r',  d => popScale(d.population));
    cityPopLabels
      .attr('x', d => { const n = NODES_DATA.find(n => n.name === d.name); return n ? n.x : 0; })
      .attr('y', d => { const n = NODES_DATA.find(n => n.name === d.name); return n ? n.y + popScale(d.population) + 16 : 0; });
  });
}


/* ═══════════════════════════════════════════════════════════════
   TIMELINE PANEL
   ═══════════════════════════════════════════════════════════════ */
function initTimeline() {
  const { yearRange, tickYears, nodeRadius, squareSize, arcNodeX, axisX, labelAltOffset } = CONFIG.timeline;
  const TW = 200, TH = 700, marginT = 20, marginB = 18;

  const svg   = d3.select('#timelineSvg').attr('width', TW).attr('height', TH);
  const scale = d3.scaleLinear().domain(yearRange).range([marginT, TH - marginB]);

  svg.append('line').attr('class', 'timeline-axis')
    .attr('x1', axisX).attr('y1', marginT).attr('x2', axisX).attr('y2', TH - marginB);

  svg.selectAll('.tl-tick').data(tickYears).join('line').attr('class', 'timeline-tick')
    .attr('x1', axisX - 5).attr('y1', d => scale(d)).attr('x2', axisX + 5).attr('y2', d => scale(d));

  svg.selectAll('.tl-yr').data(tickYears).join('text').attr('class', 'tl-year-lbl')
    .attr('x', axisX - 8).attr('y', d => scale(d) + 3).attr('text-anchor', 'end').text(d => d);

  const artists = NODES_DATA.filter(d => d.type === 'artist' && d.birthYear);
  const artistNames = [...new Set(artists.map(a => a.name))];
  const tNodes = [];
  artists.forEach(a => {
    tNodes.push({ ...a, year: a.birthYear, nodeType: 'birth' });
    tNodes.push({ ...a, year: a.deathYear, nodeType: 'death' });
  });

  svg.selectAll('.timeline-arc').data(artists).join('path').attr('class', 'timeline-arc')
    .attr('d', d => {
      const y1 = scale(d.birthYear), y2 = scale(d.deathYear), midY = (y1 + y2) / 2, cx = arcNodeX - 22;
      return `M${arcNodeX} ${y1} Q${cx} ${midY} ${arcNodeX} ${y2}`;
    });

  svg.selectAll('.timeline-node')
    .data(tNodes)
    .join(enter => enter.append(
      d => document.createElementNS('http://www.w3.org/2000/svg', d.nodeType === 'birth' ? 'circle' : 'rect')
    ))
    .attr('class', 'timeline-node')
    .attr('fill', CONFIG.node.artistColor)
    .each(function(d) {
      const el = d3.select(this), y = scale(d.year);
      if (d.nodeType === 'birth') {
        el.attr('cx', arcNodeX).attr('cy', y).attr('r', nodeRadius);
      } else {
        el.attr('x', arcNodeX - squareSize / 2).attr('y', y - squareSize / 2)
          .attr('width', squareSize).attr('height', squareSize);
      }
    })
    .on('click', (e, d) => { e.stopPropagation(); selectNode(d.name, d); });

  svg.selectAll('.tl-node-lbl').data(tNodes).join('text').attr('class', 'tl-node-lbl')
    .attr('x', d => {
      const idx = artistNames.indexOf(d.name);
      return arcNodeX + 10 + (idx % 2 === 0 ? 0 : labelAltOffset);
    })
    .attr('y', d => scale(d.year) + 3.5)
    .attr('text-anchor', 'start')
    .text(d => `${d.name.split(' ')[0]} ${d.nodeType === 'birth' ? 'b.' : 'd.'} ${d.year}`);
svg.selectAll('.timeline-node').style('opacity', CONFIG.timelineEffects.deselectedOpacity);
  svg.selectAll('.tl-node-lbl').style('opacity', CONFIG.timelineEffects.deselectedOpacity);
}


/* ═══════════════════════════════════════════════════════════════
   SEARCH — live filter with autofill dropdown
   Selecting a result highlights that node plus its linked targets
   (reuses selectNode, same as clicking the node directly).
   ═══════════════════════════════════════════════════════════════ */
const searchInput      = document.getElementById('searchInput');
const searchResultsEl  = document.getElementById('searchResults');

function renderSearchResults(query) {
  searchResultsEl.innerHTML = '';
  if (!query.trim()) return;

  const q = query.trim().toLowerCase();
  const matches = NODES_DATA.filter(d => d.name.toLowerCase().includes(q));

  if (!matches.length) {
    searchResultsEl.innerHTML = '<div class="search-empty">No matches</div>';
    return;
  }

  matches.slice(0, 8).forEach(d => {
    const color = d.type === 'artist' ? CONFIG.node.artistColor : CONFIG.node.cityColor;
    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = `
      <span class="search-result-swatch" style="background:${color}"></span>
      <span>${d.name}</span>
      <span class="search-result-type">${d.type}</span>
    `;
    item.addEventListener('click', e => {
      e.stopPropagation();
      selectNode(d.name, d);
      searchInput.value = d.name;
      searchResultsEl.innerHTML = '';
    });
    searchResultsEl.appendChild(item);
  });
}

searchInput.addEventListener('input', e => renderSearchResults(e.target.value));
searchInput.addEventListener('focus', e => { if (e.target.value) renderSearchResults(e.target.value); });
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = e.target.value.trim().toLowerCase();
    const match = NODES_DATA.find(d => d.name.toLowerCase() === q) ||
                  NODES_DATA.find(d => d.name.toLowerCase().includes(q));
    if (match) { selectNode(match.name, match); searchInput.value = match.name; searchResultsEl.innerHTML = ''; }
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('#tabSearch')) searchResultsEl.innerHTML = '';
});


/* ═══════════════════════════════════════════════════════════════
   TOOLS PANEL TAB SWITCHING (Search ↔ Compare)
   ═══════════════════════════════════════════════════════════════ */
function switchTab(tab) {
  document.getElementById('tabSearchBtn').classList.toggle('active', tab === 'search');
  document.getElementById('tabCompareBtn').classList.toggle('active', tab === 'compare');
  document.getElementById('tabSearch').classList.toggle('active', tab === 'search');
  document.getElementById('tabCompare').classList.toggle('active', tab === 'compare');
}
document.getElementById('tabSearchBtn').addEventListener('click', () => switchTab('search'));
document.getElementById('tabCompareBtn').addEventListener('click', () => switchTab('compare'));


/* ═══════════════════════════════════════════════════════════════
   COMPARE — up to three artists/cities side by side
   Populates the network + timeline highlight to the union of the
   selected nodes and their direct links, and renders a comparison
   grid with each node's key facts.
   ═══════════════════════════════════════════════════════════════ */
const compareSelectIds = ['compareSelect1', 'compareSelect2', 'compareSelect3'];

compareSelectIds.forEach(id => {
  const sel = document.getElementById(id);
  const artistGroup = document.createElement('optgroup'); artistGroup.label = 'Artists';
  const cityGroup   = document.createElement('optgroup'); cityGroup.label   = 'Cities';
  NODES_DATA.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.name; opt.textContent = d.name;
    (d.type === 'artist' ? artistGroup : cityGroup).appendChild(opt);
  });
  sel.appendChild(artistGroup);
  sel.appendChild(cityGroup);
  sel.addEventListener('change', updateCompare);
});

function resetNetworkHighlight() {
  const { selectedOpacity: sO } = CONFIG.effects;
  const { selectedOpacity: tsO } = CONFIG.timelineEffects;
  d3.selectAll('.network-node,.node-label').style('opacity', sO);
  d3.selectAll('.network-link').style('opacity', sO);
  d3.selectAll('.timeline-node,.tl-node-lbl').style('opacity', tsO);
  d3.selectAll('.timeline-arc').style('opacity', 0);
}

function updateCompare() {
  const selectedNames = compareSelectIds
    .map(id => document.getElementById(id).value)
    .filter(Boolean);

  const compareResultsEl = document.getElementById('compareResults');

  if (!selectedNames.length) {
    compareResultsEl.innerHTML = '<div class="compare-empty">Pick up to three to compare</div>';
    resetNetworkHighlight();
    return;
  }

  // Union of the selected nodes plus everything each one links to
  const highlightSet = new Set();
  selectedNames.forEach(name => getConnected(name).forEach(n => highlightSet.add(n)));

  const { selectedOpacity: sO, deselectedOpacity: dO, linkDeselectedOpacity: lO } = CONFIG.effects;
  const { selectedOpacity: tsO, deselectedOpacity: tdO } = CONFIG.timelineEffects;

  d3.selectAll('.network-node').style('opacity', n => highlightSet.has(n.name) ? sO : dO);
  d3.selectAll('.node-label').style('opacity',   n => highlightSet.has(n.name) ? sO : dO);
  d3.selectAll('.network-link').style('opacity', l => {
    const ls = typeof l.source === 'object' ? l.source.name : l.source;
    const lt = typeof l.target === 'object' ? l.target.name : l.target;
    return (selectedNames.includes(ls) || selectedNames.includes(lt)) ? sO : lO;
  });
  d3.selectAll('.timeline-node').style('opacity', n => selectedNames.includes(n.name) ? tsO : tdO);
  d3.selectAll('.tl-node-lbl').style('opacity',   n => selectedNames.includes(n.name) ? tsO : tdO);
  d3.selectAll('.timeline-arc').style('opacity',  n => selectedNames.includes(n.name) ? 1 : 0);

  // Comparison grid
  compareResultsEl.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'compare-grid';

  selectedNames.forEach(name => {
    const d = NODES_DATA.find(n => n.name === name);
    if (!d) return;
    const col = document.createElement('div');
    col.className = 'compare-col';
    const circle = d.image
      ? `<div class="info-circle"><img src="${d.image}" alt="${d.name}"></div>`
      : `<div class="info-circle">${d.name.charAt(0)}</div>`;
    const deathTxt = d.death ? ' · ' + d.death : '';
    col.innerHTML = `
      ${circle}
      <div class="info-name">${d.name}</div>
      <div class="info-meta">${d.type} · ${d.birth}${deathTxt}<br><em>${d["main discipline"] || ''}</em></div>
    `;
    grid.appendChild(col);
  });

  compareResultsEl.appendChild(grid);
}


/* ═══════════════════════════════════════════════════════════════
   GENERIC PANEL BEHAVIOUR — draggable + collapsible
   Reused by the legend, timeline, tools, and info panels.
   ═══════════════════════════════════════════════════════════════ */
function makePanelDraggable(panelId, headerId) {
  const panel = document.getElementById(panelId), header = document.getElementById(headerId);
  let dragging = false, ox = 0, oy = 0, sl = 0, st = 0;

  header.addEventListener('mousedown', e => {
    if (e.target.closest('.panel-btn')) return;   // don't drag when clicking a button
    dragging = true; ox = e.clientX; oy = e.clientY;
    const r = panel.getBoundingClientRect(); sl = r.left; st = r.top;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    panel.style.left = (sl + (e.clientX - ox)) + 'px';
    panel.style.top  = (st + (e.clientY - oy)) + 'px';
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
}

function makeCollapsible(toggleId, bodyId) {
  const btn = document.getElementById(toggleId), body = document.getElementById(bodyId);
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const collapsed = body.style.display === 'none';
    body.style.display = collapsed ? '' : 'none';
    btn.textContent = collapsed ? '−' : '+';
  });
}


/* ═══════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  initNetwork();
  initTimeline();
  makePanelDraggable('legendPanel', 'legendHeader');
